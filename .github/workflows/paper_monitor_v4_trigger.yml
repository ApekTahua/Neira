name: "[Every 15 Min] - Paper Trading V4 Intraday Monitor"

# See paper_monitor_trigger.yml / paper_signal_scan_v4_trigger.yml. Same
# script as V3_PAPER's monitor, only PAPER_VERSION + BANDAR_SIZING differ.
on:
  schedule:
    - cron: '*/15 2-4,6-8 * * 1-5'  # IDX hours, UTC -- same cadence as V3_PAPER's monitor
  workflow_dispatch:

concurrency:
  group: paper-trading-engine-v4
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4
        with:
          ref: worktree-v2-hmm-screener

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Library Pendukung
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Paper Trading Monitor (V4)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          PAPER_VERSION: V4_PAPER
          V4_BANDAR_SIZING: '1'
          # Tightened from backtest_v4.py's own default (0.10) 2026-08-22 --
          # isolated 9-window walk-forward against V4_PAPER's exact current
          # config beat baseline on every metric (mean alpha +22.50%->+26.17%,
          # mean PF 1.82->1.95, mean maxDD -15.46%->-14.26%, worst maxDD
          # -22.41%->-21.10%, beat-bench 6/9->7/9) and would have excluded
          # HATM (2026-08-20 entry, 9.56% ATR, -10.2% next-day loss) --
          # see docs/V3_FINDINGS_LOG.md 2026-08-22 entry for the full numbers,
          # including the one honest caveat (window 3 gets worse on n=17).
          V4_ATR_PRICE_RATIO_MAX: '0.08'
        run: python src/paper_monitor.py

      # Deliberately no failure alert here -- same reasoning as
      # paper_monitor_trigger.yml (fires every 15 min, STALE_MINUTES guard
      # inside paper_monitor.py is the real backstop).
