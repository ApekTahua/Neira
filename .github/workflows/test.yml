name: Test (worktree-v2-hmm-screener)

# This branch (V2/V3/paper-trading, everything past V1) had no CI at all --
# the daily/15-min paper-trading jobs run in production off this branch
# via bridge workflows on main, but nothing checked whether a push here
# actually kept the test suite green. Runs on every push/PR to this
# branch; all tests here are pure/local (no Supabase credentials needed).
on:
  push:
    branches: [worktree-v2-hmm-screener]
  pull_request:
    branches: [worktree-v2-hmm-screener]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest src/test_paper_trading_math.py tests/ -v
