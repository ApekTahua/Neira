name: Paper Trading -- Daily Signal Scan (trigger)

# Scheduled workflows only fire from the default branch (main), but the
# actual paper-trading code lives on worktree-v2-hmm-screener (kept off
# main so V1's protected files stay untouched). This bridge does nothing
# but dispatch the real workflow on that branch -- no src/ changes here.
on:
  schedule:
    - cron: '10 11 * * 1-5'  # 18:10 WIB, right after run_screener.yml's 18:00 WIB slot
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch paper_signal_scan.yml on worktree-v2-hmm-screener
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run paper_signal_scan.yml --repo ${{ github.repository }} --ref worktree-v2-hmm-screener

      # Covers a dispatch failure itself (e.g. permissions, API hiccup) --
      # run_guarded() inside paper_signal_scan.py only alerts on failures
      # AFTER it actually starts running, not if it never got dispatched.
      - name: Alert on dispatch failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d parse_mode="Markdown" \
            -d text="🚨 *Paper trading daily scan never started* — the bridge dispatch itself failed on $(date -u +'%Y-%m-%d %H:%M UTC'). No signal scan ran today. Check paper_signal_scan_trigger.yml's log."
