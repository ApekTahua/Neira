name: Disclosure PDF Text Extraction (trigger)

# Same bridge pattern as paper_signal_scan_trigger.yml / paper_monitor_trigger.yml:
# disclosure_extract.yml lives only on worktree-v2-hmm-screener, but
# `schedule` triggers only ever fire from the default branch (main).
# Found 2026-08-02 -- disclosure_extracts had ZERO rows despite the
# frontend already shipping a feature that reads from it (PDT text
# snippets on /disclosures), meaning this pipeline has never actually
# run automatically since it was built. This bridge does nothing but
# dispatch the real workflow on that branch; no src/ changes here.
on:
  schedule:
    - cron: '30 12 * * 1-5'  # 19:30 WIB, matches disclosure_extract.yml's own schedule
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch disclosure_extract.yml on worktree-v2-hmm-screener
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run disclosure_extract.yml --repo ${{ github.repository }} --ref worktree-v2-hmm-screener

      - name: Alert on dispatch failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d parse_mode="Markdown" \
            -d text="🚨 *Disclosure extraction never started* — the bridge dispatch failed on $(date -u +'%Y-%m-%d %H:%M UTC'). Check disclosure_extract_trigger.yml's log."
