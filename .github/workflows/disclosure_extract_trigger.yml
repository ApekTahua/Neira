name: "[19:30 WIB] - Disclosure PDF Extraction"

# `schedule` only ever fires from the default branch (main), but
# disclosure_extract.py lives only on worktree-v2-hmm-screener. Originally
# this bridged via `gh workflow run disclosure_extract.yml --ref
# worktree-v2-hmm-screener`, which 404'd: GitHub only resolves
# dispatch-by-filename against workflows indexed off the DEFAULT branch,
# and disclosure_extract.yml was never indexed there (confirmed via
# `GET /repos/{owner}/{repo}/actions/workflows` -- it doesn't list this
# file or its numeric ID at all). Fixed 2026-08-03: checkout the worktree
# branch directly and run the script inline instead of dispatching to a
# separate workflow file -- same pattern run_screener.yml already uses
# for main. No src/ changes, no cross-workflow dispatch, no ID lookup.
# SCHEDULE DISABLED 2026-09-03. This job cannot do its work from a runner:
# IDX blocks GitHub's IP ranges site-wide (verified on a runner from egress
# 20.169.50.32 -- plain requests, browser headers, cloudscraper cold and
# cloudscraper warmed all 403, and so does idx.co.id's own root page). Every
# one of its 1,661 rows since 2026-08-03 came back method='failed' with an
# empty text field, and it reported success each time. Left scheduled, all it
# can do is burn minutes writing more empty rows.
#
# The PDF fetch now runs from the self-hosted n8n box, whose IP IDX does
# serve, feeding off the public.disclosure_extract_queue view and upserting
# into disclosure_extracts. Dispatch stays available so this can be re-run by
# hand if the fetch ever becomes possible here again -- and the script is
# still the only path that does OCR, which n8n's PDF node cannot do.
on:
  workflow_dispatch:

# Same group as paper_signal_scan_trigger.yml -- see that file's comment.
# disclosure_extract.py doesn't touch paper_positions/paper_account, but
# sharing the group costs nothing (this job is short and infrequent) and
# means one lock covers every workflow that can be manually dispatched
# while a schedule is also delayed.
concurrency:
  group: paper-trading-engine
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4
        with:
          ref: worktree-v2-hmm-screener

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Pasang Tesseract + Poppler (OCR fallback dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Library Pendukung
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Disclosure Extraction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python src/disclosure_extract.py

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d parse_mode="Markdown" \
            -d text="🚨 *Disclosure extraction FAILED* — disclosure_extract_trigger.yml crashed on $(date -u +'%Y-%m-%d %H:%M UTC'). Check the GitHub Actions log."
