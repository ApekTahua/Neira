name: Diagnose IDX PDF fetch (manual only)

# Why this exists: disclosure_extract.py has written method='failed' for every
# one of 1,661 rows since 2026-08-03, and the Actions log shows plain 403s on
# the PDF download. The identical call returns a real PDF from a local
# Indonesian connection, so the suspicion is that IDX blocks datacenter IP
# ranges -- which by definition cannot be tested anywhere except on a runner.
#
# No schedule. workflow_dispatch only, runs in seconds, writes nothing. Delete
# once the question is settled.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4
        with:
          ref: worktree-v2-hmm-screener

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Library Pendukung
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper

      - name: Jalankan diagnosa fetch
        run: python src/diag_idx_pdf_fetch.py
