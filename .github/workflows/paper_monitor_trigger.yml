name: Paper Trading -- Intraday Monitor (trigger)

# See paper_signal_scan_trigger.yml -- same bridge pattern, this one
# fires the 15-min intraday monitor instead of the daily scan.
on:
  schedule:
    - cron: '*/15 2-4,6-8 * * 1-5'  # IDX hours, UTC (see paper_monitor.yml on the worktree branch)
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch paper_monitor.yml on worktree-v2-hmm-screener
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run paper_monitor.yml --repo ${{ github.repository }} --ref worktree-v2-hmm-screener

      # Deliberately NOT alerting here the same way the daily-scan trigger
      # does: this fires every 15 minutes, and a single transient dispatch
      # failure mid-session would spam Telegram all day for something the
      # next poll (15 min later) usually self-heals. The staleness guard
      # already inside paper_monitor.py (STALE_MINUTES check) is the real
      # backstop for "the monitor stopped working," not this dispatch step.
