name: Paper Trading -- Intraday Monitor (trigger)

# See paper_signal_scan_trigger.yml -- same fix (2026-08-03): the old
# `gh workflow run paper_monitor.yml --ref worktree-v2-hmm-screener`
# bridge 404'd since that file was never indexed on the default branch.
# Now checks out the worktree branch directly and runs the script inline.
#
# RESTORED 2026-08-22 after a same-day accidental deletion: this run
# (V3_PAPER) still has 3 OPEN positions in paper_positions as of the
# restore. "Retired" (2026-08-15) means no new capital/candidates, NOT
# that existing open positions stop being monitored -- deleting this
# workflow would have frozen those 3 positions in OPEN forever with no
# SL/TP1/trailing check ever firing again. Keep this alive until
# V3_PAPER's open_positions count reaches 0, then it's safe to retire
# for real.
#
# That count reached 0. Retired 2026-09-05 -- see the `on:` block below.
on:
  # SCHEDULE REMOVED 2026-09-05. The condition written into this file's own
  # header -- "keep this alive until V3_PAPER's open_positions count reaches
  # 0" -- is met: run_id 32 is 12 CLOSED, 0 OPEN, 0 PENDING. Every 15-minute
  # tick was therefore fetching quotes and querying paper_positions to decide
  # nothing, 24 times a trading day, while holding the shared
  # `paper-trading-engine` concurrency group that V4_PAPER's real monitor also
  # queues on. Kept dispatchable rather than deleted: an accidental deletion on
  # 2026-08-22 needed a restore, and a file with no schedule costs nothing.
  workflow_dispatch:

# Same group as paper_signal_scan_trigger.yml / disclosure_extract_trigger.yml
# -- see that file's comment. Queues rather than overlaps if a 15-min tick
# fires while a manual dispatch (of this or another paper-trading workflow)
# is still running.
concurrency:
  group: paper-trading-engine
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4
        with:
          ref: worktree-v2-hmm-screener

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Library Pendukung
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Paper Trading Monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          # Same pin as paper_signal_scan_trigger.yml -- keeps V3_PAPER's
          # entry-fill sizing byte-identical after BANDAR_SIZING_ENABLED's
          # default flipped to ON 2026-08-15.
          V4_BANDAR_SIZING: '0'
        run: python src/paper_monitor.py

      # Deliberately no failure alert here (unlike the daily-scan trigger):
      # fires every 15 min, a transient failure mid-session would spam
      # Telegram for something the next poll usually self-heals. The
      # STALE_MINUTES guard inside paper_monitor.py is the real backstop.
