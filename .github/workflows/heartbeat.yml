name: "Heartbeat - data freshness (external to n8n)"

# Checks DB1 freshness from outside n8n. A failing run emails the repo owner.
# 13:30 UTC = 20:30 WIB (Mon-Sat), 23:30 UTC = 06:30 WIB (Mon-Sat mornings).
# Read-only: anon key, SELECT over the public REST API. Audit L-004.
on:
  schedule:
    - cron: '30 13 * * 1-6'
    - cron: '30 23 * * 0-5'
    # Hourly n8n uptime ping (job n8n-health below). Replaces an external uptime monitor.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n8n-health:
    if: github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping n8n /healthz (15 s timeout, 2 retries)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://n8n.newscraperai.site/healthz || true)
            [ "$code" = "200" ] && echo "n8n OK" && exit 0
            sleep 5
          done
          echo "::error::n8n tidak merespons"
          exit 1
  heartbeat:
    if: github.event.schedule != '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check data freshness
        env:
          HEARTBEAT_DB1_URL: ${{ secrets.HEARTBEAT_DB1_URL }}
          HEARTBEAT_DB1_ANON_KEY: ${{ secrets.HEARTBEAT_DB1_ANON_KEY }}
        run: python3 .github/scripts/heartbeat.py
