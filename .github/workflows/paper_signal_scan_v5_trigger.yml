name: "[18:10 WIB] - Paper Trading V5 Daily Signal Scan"

# Fourth concurrent paper run. V5_PAPER is V4_PAPER with EXACTLY ONE variable
# changed: V4_SL_MULT 1.5 -> 3.0. Both of V4's other env vars are copied
# verbatim below so the two arms differ in nothing else -- same screener, same
# signals, same days, same starting cash, same position sizing (measured: a
# 3 ATR stop fills the identical 96 lots as 1.5 ATR, because ALLOC_PCT binds
# and the risk cap stays slack until roughly 13.9 ATR).
#
# WHY IT EXISTS. The nine historical walk-forward windows have graded ~290
# configurations; under a zero-edge null the best of 262 draws would be expected
# to show MORE mean alpha than the 3 ATR result actually does. HOLDOUT_PROTOCOL
# Rule 1 therefore says those windows can rule an idea OUT but never let one IN,
# and only forward paper-trading data can promote a change. V4_PAPER alone would
# not produce enough of it until roughly February. This arm starts that clock
# now, without touching V4_PAPER, which stays frozen.
#
# ITS PROMOTION RULE WAS WRITTEN FIRST, before this file or its database rows
# existed: docs/EXPERIMENT_REGISTER.md on worktree-v2-hmm-screener, section
# "Forward experiment: V5_PAPER (3 ATR stop), promotion rule". Paired analysis
# over DIVERGENT pairs only (the arms buy the same names on the same days and
# differ only in exit, so they are not independent samples), one deciding
# metric, a 30-divergent-pair bar, two veto-only guardrails, and an explicit
# no-peeking clause. Do not read the deciding metric early.
#
# SILENT BY DESIGN. No TELEGRAM_* env vars on the run step below, so
# paper_common.notify() returns early and this arm posts nothing. The failure
# alert at the bottom keeps its secrets: quiet in normal operation, loud when
# broken. That split is deliberate -- a silent run with no failure alert is
# unmonitored, and this project has already been burned by trusting a quiet
# success.
#
# PAIRED WITH: paper_monitor_v5_trigger.yml. If you change the screener,
# scoring, or any config env var for V4, mirror it here or the comparison
# silently stops being about stop width. That drift is the main maintenance
# risk of running two arms.
on:
  # Same three slots as V4's scan, for the same reason: GitHub silently skips
  # the primary often enough that the extra slots are what make the day
  # dependable. The scan is idempotent -- it derives `today` from the latest
  # ihsg_eod trade_date and no-ops if last_signal_date already matches.
  schedule:
    - cron: '10 11 * * 1-5'  # 18:10 WIB, primary -- needs today's fresh ihsg_eod
    - cron: '10 13 * * 1-5'  # 20:10 WIB, catch-up
    - cron: '10 15 * * 1-5'  # 22:10 WIB, last resort
  workflow_dispatch:

# Own group -- independent run, disjoint run_id-scoped rows, no reason to queue
# behind V4_PAPER's cycle.
concurrency:
  group: paper-trading-engine-v5
  cancel-in-progress: false

jobs:
  signal-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4
        with:
          ref: worktree-v2-hmm-screener

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Library Pendukung
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Paper Trading Signal Scan (V5)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # No TELEGRAM_* here on purpose -- see the header. notify() returns
          # early without them and this arm stays silent.
          PAPER_VERSION: V5_PAPER
          # THE one variable under test.
          V4_SL_MULT: '3.0'
          # Copied verbatim from paper_signal_scan_v4_trigger.yml so the arms
          # differ in nothing but the line above.
          V4_BANDAR_SIZING: '1'
          V4_ATR_PRICE_RATIO_MAX: '0.08'
        run: python src/paper_signal_scan.py

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d parse_mode="Markdown" \
            -d text="🚨 *[V5_PAPER] Paper trading daily scan FAILED* — paper_signal_scan_v5_trigger.yml crashed on $(date -u +'%Y-%m-%d %H:%M UTC'). This is the silent stop-width arm; V4_PAPER is unaffected. Check the GitHub Actions log."
