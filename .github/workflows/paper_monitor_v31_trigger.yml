name: Paper Trading V3.1 -- Intraday Monitor (trigger)

# See paper_monitor_trigger.yml / paper_signal_scan_v31_trigger.yml. Same
# script as V3_PAPER's monitor, only PAPER_VERSION + V3.1 filter env vars differ.
#
# RESTORED 2026-08-22 after a same-day accidental deletion: this run
# (V3.1_PAPER) still has 6 OPEN positions in paper_positions as of the
# restore. "Retired" (2026-08-15) means no new capital/candidates, NOT
# that existing open positions stop being monitored -- deleting this
# workflow would have frozen those 6 positions in OPEN forever with no
# SL/TP1/trailing check ever firing again. Keep this alive until
# V3.1_PAPER's open_positions count reaches 0, then it's safe to retire
# for real.
on:
  # SCHEDULE REMOVED 2026-09-07, same retirement condition and same reasoning as
  # paper_monitor_trigger.yml carried for V3_PAPER on 2026-09-05: keep it alive
  # until the run's open-position count reaches 0. That is now true. run_id 35
  # is 8 CLOSED, 0 OPEN, 0 PENDING -- its last five OPEN rows were positions the
  # run was retired underneath on 2026-08-15 and never exited; they were closed
  # as RUN_RETIRED on 2026-09-06.
  #
  # V3.1_PAPER is also in paper_common.RETIRED_PAPER_VERSIONS, so it cannot open
  # anything new either. Every 15-minute tick was fetching quotes and querying
  # paper_positions to decide nothing, ~24 times a trading day.
  #
  # Kept dispatchable rather than deleted: an accidental deletion on 2026-08-22
  # needed a restore, and a file with no schedule costs nothing.
  workflow_dispatch:

concurrency:
  group: paper-trading-engine-v31
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4
        with:
          ref: worktree-v2-hmm-screener

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Library Pendukung
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Paper Trading Monitor (V3.1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          PAPER_VERSION: V3.1_PAPER
          V4_ARA_FILTER: '1'
          V4_ATR_PRICE_RATIO_MAX: '0.08'
          V4_SCORE_WEEKLY_COMP_ABS_CAP_Q: '0.81'
        run: python src/paper_monitor.py

      # Deliberately no failure alert here -- same reasoning as
      # paper_monitor_trigger.yml (fires every 15 min, STALE_MINUTES guard
      # inside paper_monitor.py is the real backstop).
