name: "[18:10 WIB] - Paper Trading V4 Daily Signal Scan"

# Third, independent, concurrent paper run alongside V3_PAPER and
# V3.1_PAPER (see paper_signal_scan_trigger.yml for the
# schedule-must-run-from-default-branch background). Same script, same
# run-id-lookup mechanism (paper_common.py's get_paper_run_id) -- only
# PAPER_VERSION and the two env vars below differ, so paper_signal_scan.py
# itself needed zero forking. V4 = V3_PAPER's frozen config plus two
# changes, each validated in isolation before combining: BANDAR_SIZING_
# ENABLED=1 (Bandarmology concentration-based sizing, see
# docs/BANDARMOLOGY_DESIGN.md) and, added 2026-08-22, ATR_PRICE_RATIO_MAX
# tightened 0.10->0.08 (9-window walk-forward beat baseline on every
# metric -- mean alpha, PF, mean/worst maxDD, beat-bench count -- and would
# have excluded HATM's 2026-08-20 entry, a real -10.2% next-day loss; see
# docs/V3_FINDINGS_LOG.md 2026-08-22 entry for full numbers and the one
# honest caveat, window 3 getting worse on n=17).
on:
  # CATCH-UP SLOTS (2026-09-01). The 11:10 slot alone proved unreliable --
  # GitHub silently skipped it two trading days running (2026-08-31 and
  # 2026-09-01), each time needing a manual dispatch to rescue the day, even
  # though today's ihsg_eod was already loaded and the scan would have worked.
  # Re-pushing the file (the standard fix for a stale schedule registration)
  # helped but did not make it dependable.
  #
  # Extra slots are safe to fire because the scan is idempotent by design:
  # paper_signal_scan.py derives `today` from the latest ihsg_eod trade_date
  # (not the wall clock) and returns immediately if last_signal_date already
  # matches it. So the first slot that actually fires does the work and every
  # later one no-ops with a [SKIP] line. All slots sit in the same UTC day as
  # the primary, so neither the date-rollover nor the is_idx_trading_day()
  # weekday gate behaves differently between them.
  schedule:
    - cron: '10 11 * * 1-5'  # 18:10 WIB, primary -- needs today's fresh ihsg_eod
    - cron: '10 13 * * 1-5'  # 20:10 WIB, catch-up
    - cron: '10 15 * * 1-5'  # 22:10 WIB, last resort
  workflow_dispatch:

# Own concurrency group -- independent run, disjoint run_id-scoped rows, no
# reason to queue behind V3_PAPER/V3.1_PAPER's own scan/monitor cycle.
concurrency:
  group: paper-trading-engine-v4
  cancel-in-progress: false

jobs:
  signal-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4
        with:
          ref: worktree-v2-hmm-screener

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Library Pendukung
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan Paper Trading Signal Scan (V4)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          PAPER_VERSION: V4_PAPER
          V4_BANDAR_SIZING: '1'
          V4_ATR_PRICE_RATIO_MAX: '0.08'
        run: python src/paper_signal_scan.py

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d parse_mode="Markdown" \
            -d text="🚨 *[V4_PAPER] Paper trading daily scan FAILED* — paper_signal_scan_v4_trigger.yml crashed on $(date -u +'%Y-%m-%d %H:%M UTC'). No signal scan ran today. Check the GitHub Actions log."
