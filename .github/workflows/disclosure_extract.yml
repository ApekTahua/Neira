name: Disclosure PDF Text Extraction

on:
  schedule:
    # 19:30 WIB (12:30 UTC) -- after the disclosures_flat prune+refresh
    # cron (19:00 WIB) so it only ever sees the already-curated set.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil kode dari repository
      uses: actions/checkout@v4

    - name: Pasang Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Pasang Tesseract + Poppler (OCR fallback dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils

    - name: Install Library Pendukung
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Jalankan Disclosure Extraction
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python src/disclosure_extract.py
