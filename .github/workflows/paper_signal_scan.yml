name: Paper Trading -- Daily Signal Scan

on:
  schedule:
    # 18:10 WIB (11:10 UTC), right after the existing 18:00 WIB screener
    # slot that already reliably has fresh ihsg_eod data.
    - cron: '10 11 * * 1-5'
  workflow_dispatch:

jobs:
  signal-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil kode dari repository
      uses: actions/checkout@v4

    - name: Pasang Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Library Pendukung
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Jalankan Paper Trading Signal Scan
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      run: python src/paper_signal_scan.py
