name: "[18:00 WIB] - Quant Screener Daily Signal"

on:
  schedule:
    # 17:00 WIB (10:00 UTC) berjalan HANYA di hari Senin-Jumat.
    # Dimajukan 2 jam sebagai buffer: scheduled run GitHub Actions sering
    # telat ~2 jam saat load tinggi, jadi target real ~18:00 WIB.
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Fitur ini agar kamu bisa klik "Run" manual kapan saja dari web

jobs:
  execute-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil kode dari repository
      uses: actions/checkout@v4

    - name: Pasang Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Library Pendukung
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Jalankan Script Python Quant Screener
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      run: python src/screener.py

    # Silent failure means zero signals sent and no one notices until the
    # next day. This is workflow-level (not a change to screener.py), so
    # it doesn't touch the protected file.
    - name: Alert on failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      run: |
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_USER_ID}" \
          -d parse_mode="Markdown" \
          -d text="🚨 *Neira screener FAILED* — run_screener.yml crashed on $(date -u +'%Y-%m-%d %H:%M UTC'). No signals were sent today. Check the GitHub Actions log."
